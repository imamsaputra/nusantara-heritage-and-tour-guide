
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NusantaraHeritage Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html, body, #map {
  margin: 0;
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([2.68, 98.88], 10);

L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

L.marker([2.68, 98.88])
  .addTo(map)
  .bindPopup('Danau Toba');

L.marker([2.66, 98.86])
  .addTo(map)
  .bindPopup('Contoh lokasi budaya');
</script>
</body>
</html>
